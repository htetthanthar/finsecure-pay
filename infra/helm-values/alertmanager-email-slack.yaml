# Alertmanager routing: e-mail AND Slack (used when SLACK_WEBHOOK_URL is set).
# The Slack webhook URL and SMTP password are mounted from the
# alertmanager-notifiers Secret as files.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: ${SMTP_USERNAME}
      smtp_auth_username: ${SMTP_USERNAME}
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-notifiers/smtp-password
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: finsecure-team
          matchers: ['namespace = "finsecure"']
        - receiver: finsecure-team
          matchers: ['alertname =~ "FinSecure.*"']
        - receiver: finsecure-team
          matchers: ['severity = "critical"']
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: ["alertname", "namespace", "pod"]
    receivers:
      - name: "null"
      - name: finsecure-team
        email_configs:
          - to: ${ALERT_EMAIL_TO}
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}) - FinSecure Pay'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-notifiers/slack-webhook-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} [{{ .Status | toUpper }}]'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Severity: `{{ .Labels.severity }}`{{ if .Labels.pod }} | Pod: `{{ .Labels.pod }}`{{ end }}
              {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
