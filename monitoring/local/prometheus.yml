# Local (docker compose) scrape config. Labels mimic what the Kubernetes
# ServiceMonitor adds, so the same Grafana dashboard works locally.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: finsecure-pay
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          namespace: finsecure
