apiVersion: v1
kind: Namespace
metadata:
  name: finsecure
  labels:
    # Pod Security Admission: reject any pod that is not fully hardened
    # (root user, privilege escalation, host access, added capabilities...).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
