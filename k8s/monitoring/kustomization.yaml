apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Monitoring add-ons for FinSecure Pay. Requires the kube-prometheus-stack CRDs
# (ServiceMonitor, PrometheusRule) - install the stack first (infra/scripts/bootstrap-cluster.sh).

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  # Picked up automatically by the Grafana dashboard sidecar (label grafana_dashboard=1).
  - name: finsecure-pay-dashboard
    files:
      - dashboards/finsecure-pay.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: FinSecure Pay
