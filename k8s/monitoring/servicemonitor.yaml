apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finsecure-pay
  labels:
    app.kubernetes.io/name: finsecure-pay
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: finsecure-pay
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
