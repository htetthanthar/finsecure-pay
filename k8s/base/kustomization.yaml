apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for FinSecure Pay. Environment-specific values (image tag,
# replica bounds, ingress settings) are set in overlays/.

namespace: finsecure

labels:
  - pairs:
      app.kubernetes.io/part-of: finsecure-pay
      app.kubernetes.io/managed-by: kustomize

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# The ConfigMap name gets a content hash suffix (e.g. finsecure-pay-config-7h2k9),
# and the Deployment reference is rewritten to match. Any config change therefore
# triggers a new rollout, and `kubectl rollout undo` also restores the previous
# configuration - config and code roll back together.
configMapGenerator:
  - name: finsecure-pay-config
    envs:
      - app-config.env

images:
  - name: finsecure-pay
    newName: finsecure-pay
    newTag: local
