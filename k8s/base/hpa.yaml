apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finsecure-pay
  labels:
    app.kubernetes.io/name: finsecure-pay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finsecure-pay
  minReplicas: 2          # never fewer than two: no single point of failure
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # % of the CPU *request* (100m)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Wait 5 minutes before removing pods to avoid flapping.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
