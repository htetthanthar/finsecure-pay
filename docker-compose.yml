# Local development stack.
#   docker compose up --build                      -> API on http://localhost:8080
#   docker compose --profile monitoring up --build -> + Prometheus :9090, Grafana :3000
services:
  api:
    build:
      context: .
      args:
        VERSION: local
    image: finsecure-pay:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      MAX_TRANSACTION_AMOUNT: "10000"
      REVIEW_THRESHOLD: "5000"
      ALLOWED_CURRENCIES: SGD,USD,EUR,GBP,MYR,JPY
      BLOCKED_COUNTRIES: KP,IR
      # Optional: set FINSECURE_API_KEYS in your shell to enable API-key auth locally.
      API_KEYS: ${FINSECURE_API_KEYS:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ./k8s/monitoring/dashboards:/var/lib/grafana/dashboards:ro
